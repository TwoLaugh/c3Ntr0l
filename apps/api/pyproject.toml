[project]
name = "c3ntr0l-api"
version = "0.1.0"
description = "FastAPI backend for the c3Ntr0l personal operating system."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.1",
    "fastapi>=0.115.0",
    "google-auth>=2.29.0",
    "openai>=1.55.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
